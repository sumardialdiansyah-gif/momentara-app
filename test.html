<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Tombol MOMENTARA</title></head><body>
<h1>Uji Tombol</h1>
<p id="status">Belum diklik.</p>
<button onclick="document.getElementById('status').textContent='Tombol berhasil diklik!';">Klik Saya</button>
<p>Jika teks di atas berubah setelah klik, JavaScript berjalan di halaman ini. Jika tidak berubah, JavaScript diblokir di lingkungan ini.</p>
<script>document.getElementById('status').textContent='Skrip inline berjalan. Silakan klik tombol.';</script>
</body></html>
